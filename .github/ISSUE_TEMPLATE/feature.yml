name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the review workflow problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the smallest observable behavior that solves the problem.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - Browser runtime
        - Chrome extension
        - Command-line installer
        - Claude Code post-hook
        - Agent skill
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal can preserve a dependency-free browser runtime.
          required: true
        - label: The proposal can keep comment data local by default.
          required: true
